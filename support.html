<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Dotney 技术支持与意见反馈。在这里您可以提交您在使用中遇到的问题、灵感分类建议或功能改进意见。我们将尽快为您解答。">
  <title>技术支持与意见反馈 - Dotney</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">✨</div>
        <span>Dotney</span>
      </a>
      <nav>
        <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="support.html" class="active">技术支持</a></li>
          <li><a href="privacy.html">隐私政策</a></li>
          <li><a href="support_en.html" style="opacity: 0.85; font-size: 0.85rem; padding: 0.2rem 0.5rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;">EN</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Support Form Content -->
  <main>
    <div class="support-container">
      <h2 style="margin-bottom: 1rem;">技术支持与意见反馈</h2>
      <p style="text-align: center; color: var(--text-secondary); margin-bottom: 3rem; font-size: 0.95rem;">
        在使用「Dotney」App、瞬移灵感收藏或配置轻点背面过程中遇到任何问题？请填写下表，我们将第一时间为您解答。
      </p>

      <form id="feedbackForm" class="glass-card">
        <!-- Contact Email -->
        <div class="form-group">
          <label for="email">您的联系邮箱 <span style="color: var(--accent);">*</span></label>
          <input type="email" id="email" class="form-control" placeholder="example@domain.com" required>
        </div>

        <!-- Feedback Type -->
        <div class="form-group">
          <label for="feedbackType">反馈类型</label>
          <select id="feedbackType" class="form-control">
            <option value="bug">🐛 问题与 Bug 反馈</option>
            <option value="feature">💡 新功能与改进建议</option>
            <option value="other">💬 其他咨询或合作</option>
          </select>
        </div>

        <!-- Version Info (Row) -->
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
          <div class="form-group" style="margin-bottom: 0;">
            <label for="appVersion">App 版本</label>
            <select id="appVersion" class="form-control">
              <option value="v1.0.0">v1.0.0 (最新)</option>
              <option value="v0.9.9">v0.9.9 (Beta)</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label for="systemVersion">iOS 系统版本</label>
            <select id="systemVersion" class="form-control">
              <option value="iOS 18">iOS 18</option>
              <option value="iOS 17">iOS 17</option>
              <option value="iOS 16">iOS 16 (部分不兼容)</option>
            </select>
          </div>
        </div>

        <!-- Problem Details -->
        <div class="form-group">
          <label for="description">问题或建议详细描述 <span style="color: var(--accent);">*</span></label>
          <textarea id="description" class="form-control" placeholder="请详细描述您遇到的问题，如果是快捷指令运行报错，请附带描述具体的报错信息，以便我们快速定位原因。" required></textarea>
        </div>

        <!-- Screenshots Upload Dropzone -->
        <div class="form-group">
          <label>上传相关截图 (最多 3 张)</label>
          <div id="dropzone" class="file-dropzone">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span style="font-size: 0.9rem; font-weight: 500; margin-top: 0.5rem;">点击上传 或 将截图拖拽到此处</span>
            <span style="font-size: 0.75rem; color: var(--text-muted);">仅支持 JPG/PNG 图片文件</span>
            <input type="file" id="screenshotInput" accept="image/*" multiple style="display: none;">
          </div>
          <div id="previewContainer" class="preview-container"></div>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          🚀 确认提交反馈
        </button>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer>
    <div class="footer-content">
      <div class="footer-info">
        <div class="logo" style="margin-bottom: 0.5rem;">
          <div class="logo-icon" style="width:28px; height:28px; font-size: 1rem;">✨</div>
          <span style="font-size: 1.1rem;">Dotney</span>
        </div>
        <p>© 2026 Dotney. 保留所有权利。</p>
        <p>去待办的灵感收藏软件 · 为个人心动与生活灵感打造。</p>
      </div>
      <div class="footer-links">
        <a href="index.html">首页</a>
        <a href="support.html">技术支持</a>
        <a href="privacy.html">隐私政策</a>
      </div>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
